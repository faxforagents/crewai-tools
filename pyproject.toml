[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faxforagents-crewai"
version = "0.2.0"
description = "Fax for Agents tools for CrewAI."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fax for Agents", email = "hello@faxforagents.com"}]
keywords = ["crewai", "fax", "tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "crewai>=1.15.35,<1.16",
  "crewai-tools>=1.15.35,<1.16",
  "faxforagents>=0.2.3,<0.7",
  "pydantic>=2.11.9,<3",
]

[project.urls]
Homepage = "https://faxforagents.com/"
Documentation = "https://faxforagents.com/docs/"
Repository = "https://github.com/faxforagents/crewai-tools"
Changelog = "https://github.com/faxforagents/crewai-tools/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<3", "httpx>=0.27,<1"]

[tool.crewai]
type = "tool"
project_id = "97494032-e0c1-4316-88fb-04e551b00648"

[tool.hatch.build.targets.wheel]
packages = ["src/faxforagents_crewai"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "submissions", "pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/faxforagents_crewai"]
